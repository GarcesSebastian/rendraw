<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>rendraw · código → render</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }
      #frame {
        width: 1600px;
        height: 1200px;
        display: grid;
        grid-template-columns: 760px 840px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        overflow: hidden;
      }
      /* ---- Left: code panel ---- */
      #code {
        background: #0f1420;
        color: #e6edf3;
        display: flex;
        flex-direction: column;
      }
      #code-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 26px 34px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
      }
      .dot.r {
        background: #ff5f56;
      }
      .dot.y {
        background: #ffbd2e;
      }
      .dot.g {
        background: #27c93f;
      }
      #code-head .pkg {
        margin-left: 12px;
        font:
          600 20px ui-monospace,
          "SF Mono",
          Menlo,
          Consolas,
          monospace;
        color: #9cdcfe;
        letter-spacing: 0.3px;
      }
      #code-head .badge {
        margin-left: auto;
        font:
          700 15px ui-sans-serif,
          system-ui,
          sans-serif;
        background: #cb3837;
        color: #fff;
        padding: 6px 12px;
        border-radius: 6px;
        letter-spacing: 0.5px;
      }
      #title {
        padding: 24px 34px 6px;
        font:
          700 26px ui-sans-serif,
          system-ui,
          sans-serif;
        color: #fff;
      }
      #subtitle {
        padding: 0 34px 18px;
        font:
          400 17px ui-sans-serif,
          system-ui,
          sans-serif;
        color: #8b98a9;
      }
      pre {
        margin: 0;
        padding: 10px 34px 34px;
        overflow: hidden;
        flex: 1;
      }
      code {
        font:
          500 21px/1.65 ui-monospace,
          "SF Mono",
          Menlo,
          Consolas,
          monospace;
        white-space: pre;
        tab-size: 2;
      }
      .tok-key {
        color: #c792ea;
      }
      .tok-fn {
        color: #82aaff;
      }
      .tok-str {
        color: #c3e88d;
      }
      .tok-num {
        color: #f78c6c;
      }
      .tok-com {
        color: #5c6b7a;
        font-style: italic;
      }
      .tok-cls {
        color: #ffcb6b;
      }
      .tok-pun {
        color: #89ddff;
      }
      /* ---- Right: live canvas ---- */
      #stage {
        position: relative;
        background:
          linear-gradient(#f4f6fa, #f4f6fa) padding-box,
          repeating-linear-gradient(0deg, #e9edf3 0 1px, transparent 1px 40px),
          repeating-linear-gradient(90deg, #e9edf3 0 1px, transparent 1px 40px);
        background-color: #fbfcfe;
        display: flex;
        flex-direction: column;
      }
      #stage-head {
        padding: 22px 30px 0;
        font:
          600 16px ui-sans-serif,
          system-ui,
          sans-serif;
        color: #5b6676;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #stage-head::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #27c93f;
        box-shadow: 0 0 0 4px rgba(39, 201, 63, 0.18);
      }
      #canvas-wrap {
        flex: 1;
        padding: 18px 30px 30px;
      }
      canvas {
        width: 100%;
        height: 100%;
        background: #ffffff;
        border: 1px solid #dfe5ee;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(16, 32, 64, 0.08);
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <section id="code">
        <div id="code-head">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          <span class="pkg">rendraw</span>
          <span class="badge">npm i rendraw</span>
        </div>
        <div id="title"></div>
        <div id="subtitle"></div>
        <pre><code id="src"></code></pre>
      </section>
      <section id="stage">
        <div id="stage-head">render en vivo</div>
        <div id="canvas-wrap">
          <canvas id="c" width="780" height="900"></canvas>
        </div>
      </section>
    </div>

    <script type="importmap">
      {
        "imports": {
          "zod": "../../node_modules/zod/index.js"
        }
      }
    </script>

    <script type="module">
      import {
        createRender,
        Vector,
      } from "../../dist/index.js";

      // Each frame is { title, subtitle, code } where `code` is the EXACT text
      // shown on the left and executed (as an async body) on the right. The
      // snippet receives `render` (already created on #c) and `Vector`.
      const FRAMES = {
        1: {
          title: "Formas básicas sobre Canvas",
          subtitle: "createRender() + render.creator.{Rect, Circle, Text}",
          code: `import { createRender, Vector } from "rendraw";

const canvas = document.querySelector("canvas");
const render = await createRender(canvas, {
  history: true,
  transform: true,
  selection: true,
});

render.creator.Rect({
  position: new Vector(90, 120),
  width: 260,
  height: 170,
  color: "#3498db",
  borderWidth: 4,
  borderColor: "#1f6aa5",
  borderRadius: 16,
});

render.creator.Circle({
  position: new Vector(560, 230),
  radius: 110,
  color: "#e74c3c",
});

render.creator.Text({
  position: new Vector(120, 430),
  text: "Hola, rendraw",
  fontSize: 46,
  fontWeight: "bold",
  color: "#1b2733",
});`,
        },
        2: {
          title: "Primitivas de diagramación 2.0",
          subtitle: "Line · Arrow · Polygon · Path · Pen",
          code: `import { createRender, Vector } from "rendraw";

const render = await createRender(canvas, { history: true });

render.creator.Line({
  from: new Vector(80, 110),
  to: new Vector(360, 110),
  color: "#1b2733",
  width: 4,
});

render.creator.Arrow({
  from: new Vector(80, 220),
  to: new Vector(380, 300),
  head: "both",
  headSize: 22,
  color: "#8e44ad",
  width: 4,
});

render.creator.Polygon({
  points: [
    new Vector(470, 120),
    new Vector(690, 230),
    new Vector(560, 400),
  ],
  fill: "#f6c445",
  stroke: "#c79a1d",
  strokeWidth: 4,
});

render.creator.Path({
  points: [
    new Vector(90, 520),
    new Vector(220, 440),
    new Vector(360, 600),
    new Vector(520, 470),
  ],
  color: "#16a085",
  width: 6,
  smoothing: 0.6,
});

render.creator.Pen({
  points: [
    new Vector(120, 760),
    new Vector(200, 700),
    new Vector(300, 800),
    new Vector(430, 690),
    new Vector(560, 790),
  ],
  color: "#e74c3c",
  width: 5,
});`,
        },
        3: {
          title: "Selección con transformador",
          subtitle: "render.transformer.add(shape) → caja y manejadores",
          code: `import { createRender, Vector } from "rendraw";

const render = await createRender(canvas, {
  transform: true,
  selection: true,
});

const card = render.creator.Rect({
  position: new Vector(210, 260),
  width: 360,
  height: 300,
  color: "#5dade2",
  borderRadius: 18,
});

// Seleccionar la forma muestra la caja de
// transformación con sus manejadores de redimensión.
render.transformer.add(card);
render.transformer.show();`,
        },
        4: {
          title: "Cámara: encuadre y zoom",
          subtitle: "render.currentCamera.bind(new Vector(x, y))",
          code: `import { createRender, Vector } from "rendraw";

const render = await createRender(canvas, {
  pan: true,
  zoom: true,
});

// Una pequeña escena repartida por el lienzo.
const focus = render.creator.Circle({
  position: new Vector(900, 700),
  radius: 90,
  color: "#e74c3c",
});

render.creator.Rect({
  position: new Vector(760, 520),
  width: 280,
  height: 360,
  color: "transparent",
  borderWidth: 5,
  borderColor: "#8e44ad",
  borderRadius: 20,
});

render.creator.Text({
  position: new Vector(610, 460),
  text: "currentCamera.bind()",
  fontSize: 34,
  fontWeight: "bold",
  color: "#1b2733",
});

// Centrar la cámara sobre el punto de interés.
render.currentCamera.bind(
  new Vector(focus.position.x, focus.position.y),
);`,
        },
        5: {
          title: "Colaboración por parches",
          subtitle: "render.on('patch') + render.applyPatch(patch)",
          code: `import { createRender, Vector } from "rendraw";

// Dos lienzos: el editor local y una réplica remota.
const render = await createRender(canvas, { history: true });
const peer = await createRender(peerCanvas, { history: true });

// Cada cambio local emite un parche granular...
render.on("patch", (patch) => {
  // ...que viaja por websocket y se aplica en el par
  // sin volver a emitir el evento "patch".
  peer.applyPatch(patch);
});

// Al crear una forma se dispara el parche "add".
render.on("create", ({ shape }) => {
  render.emit("patch", {
    op: "add",
    id: shape.id,
    type: shape.type,
    delta: { position: shape.position },
  });
});

render.creator.Rect({
  position: new Vector(120, 220),
  width: 230,
  height: 150,
  color: "#27ae60",
  borderRadius: 14,
});

render.creator.Circle({
  position: new Vector(470, 300),
  radius: 85,
  color: "#2980b9",
});`,
        },
      };

      // ---- Minimal syntax highlighter (display only) ----
      function escapeHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function highlight(src) {
        const KEY = /\b(import|from|const|let|await|new|function|return|if|else)\b/g;
        const CLS = /\b(createRender|Vector|render|peer|canvas|peerCanvas|shape|patch|card|focus)\b/g;
        // Tokenize by protecting comments and strings first.
        const parts = [];
        let i = 0;
        const re = /(\/\/[^\n]*)|("(?:[^"\\]|\\.)*")|(\d+(?:\.\d+)?)/g;
        let m;
        let last = 0;
        while ((m = re.exec(src))) {
          if (m.index > last) parts.push({ t: "code", v: src.slice(last, m.index) });
          if (m[1]) parts.push({ t: "com", v: m[1] });
          else if (m[2]) parts.push({ t: "str", v: m[2] });
          else if (m[3]) parts.push({ t: "num", v: m[3] });
          last = re.lastIndex;
        }
        if (last < src.length) parts.push({ t: "code", v: src.slice(last) });

        return parts
          .map((p) => {
            if (p.t === "com") return `<span class="tok-com">${escapeHtml(p.v)}</span>`;
            if (p.t === "str") return `<span class="tok-str">${escapeHtml(p.v)}</span>`;
            if (p.t === "num") return `<span class="tok-num">${escapeHtml(p.v)}</span>`;
            let out = escapeHtml(p.v);
            out = out.replace(KEY, '\u0001$1\u0002');
            out = out.replace(CLS, '\u0003$1\u0004');
            out = out
              .replace(/\u0001/g, '<span class="tok-key">')
              .replace(/\u0002/g, "</span>")
              .replace(/\u0003/g, '<span class="tok-cls">')
              .replace(/\u0004/g, "</span>");
            return out;
          })
          .join("");
      }

      const params = new URLSearchParams(location.search);
      const n = Number(params.get("n") || "1");
      const frame = FRAMES[n];
      if (!frame) throw new Error("Unknown frame " + n);

      document.getElementById("title").textContent = frame.title;
      document.getElementById("subtitle").textContent = frame.subtitle;
      document.getElementById("src").innerHTML = highlight(frame.code);

      const canvas = document.getElementById("c");
      canvas.width = 780;
      canvas.height = 900;

      // For the collaboration frame we need a second (off-screen) canvas so the
      // snippet's `peer`/`peerCanvas` references resolve against a real render.
      const peerCanvas = document.createElement("canvas");
      peerCanvas.width = 780;
      peerCanvas.height = 900;

      // Execute the EXACT snippet text against the live canvas. The snippet is an
      // ES-module-style source; strip its top import line (resolved above) and
      // run the rest as an async function body with createRender/Vector in scope.
      const body = frame.code
        .split("\n")
        .filter((line) => !/^\s*import\s/.test(line))
        // The snippet declares `const canvas = ...` in frame 1; drop it so it
        // uses the real element already in scope.
        .filter((line) => !/^const canvas = document\.querySelector/.test(line))
        .join("\n");

      const run = new Function(
        "createRender",
        "Vector",
        "canvas",
        "peerCanvas",
        `"use strict"; return (async () => {\n${body}\n})();`,
      );

      await run(createRender, Vector, canvas, peerCanvas);

      // Give the render loop a couple of frames to paint, then flag readiness so
      // the headless capture waits for a painted canvas.
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      await new Promise((r) => setTimeout(r, 450));
      document.title = "ready";
    </script>
  </body>
</html>
